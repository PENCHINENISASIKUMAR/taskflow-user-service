spring.config.import=optional:file:../.taskflow-dev-secrets.properties,optional:file:.taskflow-dev-secrets.properties
spring.application.name=user-service
server.port=8081
server.address=127.0.0.1
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskflow_users?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Sasikumar@999}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
springdoc.swagger-ui.path=/swagger-ui.html
logging.level.com.taskflow=INFO

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost
taskflow.jwt.secret-base64=${JWT_SECRET_BASE64:}
taskflow.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
taskflow.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
